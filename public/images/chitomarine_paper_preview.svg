<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&amp;display=swap');
      .paper-title {
        font-family: 'Times New Roman', 'Merriweather', 'Nimbus Roman', Georgia, serif;
        font-weight: 900;
        font-size: 26px;
        fill: #0f172a;
        text-anchor: middle;
        letter-spacing: 0.5px;
      }
      .paper-authors {
        font-family: 'Times New Roman', 'Merriweather', 'Nimbus Roman', Georgia, serif;
        font-weight: 500;
        font-size: 19px;
        fill: #1e293b;
        text-anchor: middle;
      }
      .paper-heading {
        font-family: 'Times New Roman', 'Merriweather', 'Nimbus Roman', Georgia, serif;
        font-weight: 800;
        font-size: 20px;
        fill: #0f172a;
        letter-spacing: 0.5px;
      }
      .paper-body {
        font-family: 'Times New Roman', 'Merriweather', 'Nimbus Roman', Georgia, serif;
        font-weight: 400;
        font-size: 18px;
        fill: #1e293b;
        line-height: 1.6;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #7A0000;
      }
    </style>
    <filter id="paperShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Dark Slate Workspace Background -->
  <rect width="1200" height="675" fill="#0f172a" />
  
  <!-- Subtle Grid Pattern for Academic Blueprint / Lab Feel -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="225" x2="1200" y2="225" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="375" x2="1200" y2="375" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="150" y1="0" x2="150" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="450" y1="0" x2="450" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="750" y1="0" x2="750" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1050" y1="0" x2="1050" y2="675" />
  </g>

  <!-- Academic Paper Sheet -->
  <rect x="70" y="25" width="1060" height="625" rx="6" fill="#ffffff" filter="url(#paperShadow)" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Academic Document Header Bar -->
  <g transform="translate(130, 65)">
    <rect x="0" y="0" width="170" height="28" rx="6" fill="#fdf2f2" stroke="#fecaca" stroke-width="1" />
    <circle cx="16" cy="14" r="5" fill="#7A0000" />
    <text x="30" y="19" class="badge-text">SCIENTIFIC PAPER</text>
    <text x="800" y="18" font-family="-apple-system, sans-serif" font-size="12" fill="#64748b" text-anchor="end">MANUSCRIPT • RESEARCH ESSAY</text>
    <line x1="0" y1="40" x2="800" y2="40" stroke="#f1f5f9" stroke-width="2" />
  </g>

  <!-- Document Title (exact match with user's uploaded paper) -->
  <text x="600" y="150" class="paper-title">CHITOMARINE: BIOPLASTIK KITOSAN DARI LIMBAH PERIKANAN</text>
  <text x="600" y="185" class="paper-title">UNTUK MENEKAN PENCEMARAN MIKROPLASTIK LAUT</text>

  <!-- Authors Line (exact match with user's uploaded paper) -->
  <text x="600" y="235" class="paper-authors">(Muhammad Rizi Adrika, Alya Aziza Puteri, Joanna Michelle Tambunan)</text>

  <!-- Section Heading (exact match) -->
  <text x="140" y="300" class="paper-heading">PENDAHULUAN</text>

  <!-- Body Paragraph (exact match with user's uploaded paper) -->
  <text x="140" y="340" class="paper-body">
    <tspan x="180" dy="0">Indonesia sebagai negara kepulauan dengan garis pantai terpanjang kedua</tspan>
    <tspan x="140" dy="32">di dunia memiliki industri pengolahan hasil perikanan yang besar, sehingga sentra</tspan>
    <tspan x="140" dy="32">pengolahan ikan setiap hari menghasilkan limbah kulit udang, cangkang kepiting</tspan>
    <tspan x="140" dy="32">atau rajungan, dan sisik ikan dalam jumlah besar. Sebagian besar limbah tersebut</tspan>
    <tspan x="140" dy="32">masih berakhir sebagai sampah tanpa nilai tambah karena belum tertangani secara</tspan>
    <tspan x="140" dy="32">optimal. Kondisi ini kontras dengan potensi kandungan kitin pada limbah tersebut,</tspan>
    <tspan x="140" dy="32">yang sesungguhnya dapat diolah menjadi bahan bernilai tinggi.</tspan>
  </text>

  <!-- Subtle Document Watermark / Bottom Footer -->
  <g transform="translate(140, 605)">
    <line x1="0" y1="0" x2="920" y2="0" stroke="#f1f5f9" stroke-width="1.5" />
    <text x="0" y="20" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8">Karya Tulis Ilmiah • Valorisasi Limbah Perikanan &amp; Bioteknologi Maritim</text>
    <text x="920" y="20" font-family="-apple-system, sans-serif" font-size="11" fill="#94a3b8" text-anchor="end">Halaman 1 dari 10</text>
  </g>
</svg>
